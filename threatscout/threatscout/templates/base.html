<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ThreatScout — Siber Tehdit İstihbaratı{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script>
    // Giriş animasyonu bu tarayıcı oturumunda zaten oynadıysa tekrar gösterme
    try { if (sessionStorage.getItem('ts-intro-seen')) document.documentElement.classList.add('intro-seen'); } catch (e) {}
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  {% block head %}{% endblock %}
</head>
<body>
  {% include "_backdrop.html" %}
  {% include "_intro.html" %}

  <div id="app">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-icon"><i class="fa-solid fa-shield-halved"></i></span>
        <span class="brand-name">Threat<span>Scout</span></span>
      </a>

      <nav class="nav" aria-label="Ana menü">
        <a href="/" {% if request.url.path == "/" %}class="active" aria-current="page"{% endif %}><i class="fa-solid fa-satellite-dish"></i> Tarama</a>
        <a href="/history" {% if "/history" in request.url.path %}class="active" aria-current="page"{% endif %}><i class="fa-solid fa-clock-rotate-left"></i> Geçmiş</a>
        <a href="/settings" {% if "/settings" in request.url.path %}class="active" aria-current="page"{% endif %}><i class="fa-solid fa-sliders"></i> Ayarlar</a>
        <a href="/panel" {% if request.url.path == "/panel" %}class="active" aria-current="page"{% endif %}><i class="fa-solid fa-chart-column"></i> Panel</a>
        <a href="/watchlist" {% if request.url.path == "/watchlist" %}class="active" aria-current="page"{% endif %}><i class="fa-solid fa-eye"></i> İzleme</a>
        <a href="/docs" target="_blank" rel="noopener"><i class="fa-solid fa-code"></i> REST API</a>
      </nav>

      <div class="nav-actions">
        <span class="badge-status"><span class="pulse-dot"></span> Motor aktif</span>
        {% if auth_required %}
        <form method="post" action="/logout">
          <button class="btn ghost btn-sm" type="submit"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
        </form>
        {% endif %}
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>ThreatScout · Tehdit istihbaratı ve IOC zenginleştirme</footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
