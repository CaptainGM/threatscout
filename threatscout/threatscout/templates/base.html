<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ThreatScout — Siber Tehdit İstihbarat Platformu{% endblock %}</title>
  
  <!-- Fontlar & İkonlar -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>

  <style>
    :root {
      --bg: #060913;
      --bg-surface: #0b1120;
      --bg-card: rgba(13, 22, 41, 0.82);
      --card-border: rgba(56, 189, 248, 0.16);
      --card-border-hover: rgba(56, 189, 248, 0.45);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #8190a5;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --accent-secondary: #818cf8;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --purple: #a855f7;
      --line: #1e293b;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      overflow-x: hidden;
      position: relative;
    }

    /* CYBER CANVAS BACKGROUND */
    #cyber-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(6, 9, 19, 0.88);
      border-bottom: 1px solid rgba(56, 189, 248, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #fff;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 1.1rem;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.45);
    }

    .brand span {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(13, 21, 39, 0.7);
      padding: 0.3rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--line);
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    nav a:hover, nav a.active {
      color: #fff;
      background: rgba(56, 189, 248, 0.15);
      box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.15);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--emerald);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--emerald);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.35); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    /* MAIN CONTAINER */
    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      flex: 1;
    }

    /* CARDS */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-card);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      border-color: var(--card-border-hover);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.85rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .card-title i {
      color: var(--accent);
    }

    /* BUTTONS */
    .btn, button {
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1.4rem;
      font-weight: 700;
      font-size: 0.925rem;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover, button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
    }

    .btn.ghost, button.ghost {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .btn.ghost:hover, button.ghost:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--text-dim);
      transform: translateY(-1px);
    }

    .btn.danger, button.danger {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
    }

    .btn.danger:hover, button.danger:hover {
      background: linear-gradient(135deg, #b91c1c, #991b1b);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.45);
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      border-radius: 6px;
    }

    /* FORMS & INPUTS */
    input, textarea, select {
      font-family: inherit;
      width: 100%;
      background: rgba(9, 14, 26, 0.85);
      color: var(--text);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18), 0 0 18px rgba(56, 189, 248, 0.25);
      background: rgba(9, 14, 26, 0.95);
    }

    label {
      display: block;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    /* TABLES */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(13, 21, 39, 0.95);
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      padding: 0.9rem 1.1rem;
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
      color: var(--text);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(56, 189, 248, 0.03);
    }

    /* BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.775rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge-critical { background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.4); box-shadow: 0 0 12px rgba(244, 63, 94, 0.25); }
    .badge-high { background: rgba(249, 115, 22, 0.15); color: #fdba74; border: 1px solid rgba(249, 115, 22, 0.4); }
    .badge-medium { background: rgba(245, 158, 11, 0.15); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-low { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-clean { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }

    .tag {
      display: inline-block;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--line);
      color: #94a3b8;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      margin: 0.15rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* RADAR SCANNER ANIMATION */
    .radar-scanner {
      display: none;
      background: rgba(10, 18, 34, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-top: 1.25rem;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
    }

    .htmx-request .radar-scanner, .radar-scanner.htmx-request {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .radar-circle {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.4);
      background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
      overflow: hidden;
      flex-shrink: 0;
    }

    .radar-sweep {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: conic-gradient(from 0deg, rgba(56, 189, 248, 0.7) 0deg, transparent 65deg, transparent 360deg);
      border-radius: 50%;
      animation: radar-spin 1.5s linear infinite;
    }

    .radar-blip {
      position: absolute;
      top: 35%;
      left: 60%;
      width: 6px;
      height: 6px;
      background: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--emerald);
      animation: blip 1.5s infinite;
    }

    @keyframes radar-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes blip {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* ONBOARDING KUTUSU */
    .guide-box {
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .guide-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      cursor: pointer;
      color: #fff;
      font-size: 0.95rem;
    }

    .guide-content {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: 1rem;
      padding: 0 1.5rem 1.5rem;
    }

    .info-card {
      background: rgba(9, 14, 26, 0.7);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 1rem;
    }

    .info-card-header {
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .info-card-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* HATA KUTUSU */
    .error {
      display: flex;
      gap: 0.9rem;
      align-items: flex-start;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-radius: var(--radius-sm);
      padding: 1rem 1.2rem;
      color: #fecdd3;
    }

    .error i {
      color: var(--rose);
      margin-top: 0.15rem;
    }

    .badge-unknown {
      background: rgba(100, 116, 139, 0.18);
      color: #cbd5e1;
      border: 1px solid rgba(100, 116, 139, 0.45);
    }

    /* TELEFON VE DAR EKRANLAR */
    @media (max-width: 720px) {
      header {
        flex-wrap: wrap;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
      }

      nav {
        flex-wrap: wrap;
        justify-content: center;
        border-radius: var(--radius-sm);
      }

      nav a {
        font-size: 0.8rem;
        padding: 0.4rem 0.7rem;
      }

      .nav-actions {
        width: 100%;
        justify-content: center;
      }

      main {
        padding: 1.25rem 1rem 3rem;
      }

      .card {
        padding: 1.1rem 1rem;
      }

      .card-header {
        flex-wrap: wrap;
        gap: 0.5rem;
      }
    }

    /* HAREKETI AZALT AYARI ACIKSA ANIMASYONLARI KAPAT */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--line);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-dim);
      background: rgba(6, 9, 19, 0.95);
      margin-top: auto;
      position: relative;
      z-index: 1;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

  <!-- CANVAS SİBER PARÇACIK ARKA PLANI -->
  <canvas id="cyber-canvas"></canvas>

  <!-- HEADER -->
  <header>
    <a class="brand" href="/">
      <div class="brand-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>Threat<span>Scout</span></div>
    </a>

    <nav>
      <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>
        <i class="fa-solid fa-satellite-dish"></i> Tarama
      </a>
      <a href="/history" {% if "/history" in request.url.path %}class="active"{% endif %}>
        <i class="fa-solid fa-clock-rotate-left"></i> Geçmiş
      </a>
      <a href="/settings" {% if "/settings" in request.url.path %}class="active"{% endif %}>
        <i class="fa-solid fa-sliders"></i> Ayarlar & Webhook
      </a>
      <a href="/docs" target="_blank">
        <i class="fa-solid fa-code"></i> REST API
      </a>
    </nav>

    <div class="nav-actions">
      <div class="badge-status">
        <span class="pulse-dot"></span> Motor Aktif
      </div>
      {% if auth_required %}
      <form method="post" action="/logout">
        <button class="btn ghost btn-sm" type="submit">
          <i class="fa-solid fa-right-from-bracket"></i> Çıkış
        </button>
      </form>
      {% endif %}
    </div>
  </header>

  <!-- MAIN BODY -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer>
    <p>ThreatScout Threat Intelligence &amp; IOC Enrichment Engine · SQLite &amp; FastAPI</p>
  </footer>

  <!-- SİBER PARÇACIK ANİMASYON MOTORU -->
  <script>
    (function() {
      const canvas = document.getElementById('cyber-canvas');
      if (!canvas) return;
      // Hareket azaltma ayari aciksa arka plan animasyonunu hic baslatma
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        canvas.style.display = 'none';
        return;
      }
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const particleCount = Math.min(Math.floor(window.innerWidth / 30), 40);

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          radius: Math.random() * 2 + 1,
          color: Math.random() > 0.4 ? 'rgba(56, 189, 248, ' : 'rgba(16, 185, 129, '
        });
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);

        // Parçacıkları çiz
        for (let i = 0; i < particles.length; i++) {
          let p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color + '0.7)';
          ctx.fill();

          // Yakın parçacıkları birbirine bağlayan siber lazer çizgileri
          for (let j = i + 1; j < particles.length; j++) {
            let p2 = particles[j];
            let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 130) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(56, 189, 248, ${0.25 * (1 - dist / 130)})`;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>

  <script>
    // htmx hata cevaplarini da ekrana basar (ornek: gecersiz IOC)
    document.body.addEventListener('htmx:beforeSwap', function (evt) {
      if (evt.detail.xhr.status >= 400) {
        evt.detail.shouldSwap = true;
        evt.detail.isError = false;
      }
    });
  </script>
</body>
</html>
