<div id="intro" role="dialog" aria-modal="true" aria-label="Açılış animasyonu">
  <div class="intro-grid" aria-hidden="true"></div>
  <button type="button" id="intro-skip" class="intro-skip">Atla <kbd>Esc</kbd></button>

  <div class="intro-stage">
    <div class="intro-ring" aria-hidden="true">
      <svg class="ring-svg" viewBox="0 0 240 240">
        <circle class="ring-track" cx="120" cy="120" r="112"/>
        <circle class="ring-progress" cx="120" cy="120" r="112" pathLength="100"/>
        <circle class="ring-dash" cx="120" cy="120" r="97"/>
      </svg>

      <div class="phase phase-finger">
        <i class="fa-solid fa-fingerprint"></i>
      </div>

      <div class="phase phase-face">
        <svg class="face-svg" viewBox="0 0 200 240">
          <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
            <path class="corner" d="M12 56 V12 H56"/>
            <path class="corner" d="M188 56 V12 H144"/>
            <path class="corner" d="M12 184 V228 H56"/>
            <path class="corner" d="M188 184 V228 H144"/>
          </g>
          <ellipse cx="100" cy="120" rx="52" ry="72" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 6" opacity="0.8"/>
          <g class="face-feat" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M72 104 q12 -9 24 0"/>
            <path d="M104 104 q12 -9 24 0"/>
            <path d="M86 152 q14 11 28 0"/>
          </g>
          <rect class="laser" x="16" y="0" width="168" height="2.5" rx="1.25"/>
        </svg>
      </div>

      <div class="phase phase-lock">
        <svg class="intro-lock" viewBox="0 0 120 150">
          <path class="shackle" d="M32 66 V44 a28 28 0 0 1 56 0 V66" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
          <rect x="14" y="64" width="92" height="76" rx="16" fill="rgba(6, 12, 22, 0.92)" stroke="currentColor" stroke-width="3.5"/>
          <circle cx="60" cy="96" r="8" fill="currentColor"/>
          <rect x="56" y="98" width="8" height="18" rx="3" fill="currentColor"/>
        </svg>
      </div>

      <div class="intro-scan"></div>
    </div>

    <div class="intro-label" aria-hidden="true">
      <span class="lbl lbl-1">1 / 3 · Parmak izi</span>
      <span class="lbl lbl-2">2 / 3 · Yüz taraması</span>
      <span class="lbl lbl-3">3 / 3 · Kilit çözülüyor</span>
      <span class="lbl lbl-4">Sistem hazır</span>
    </div>

    <div class="intro-log" aria-hidden="true">
      <p style="--d: 0.25s">&gt; Sensörler başlatılıyor</p>
      <p style="--d: 1s">&gt; Parmak izi okunuyor</p>
      <p style="--d: 1.9s">&gt; Yüz hizalanıyor</p>
      <p style="--d: 2.9s">&gt; Kilit mekanizması çözülüyor</p>
      <p class="ok" style="--d: 3.8s">&gt; Sistem hazır</p>
    </div>

    <div class="intro-bar" aria-hidden="true"><span></span></div>
  </div>
</div>
