<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş — ThreatScout</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <script>
    try { if (sessionStorage.getItem('ts-intro-seen')) document.documentElement.classList.add('intro-seen'); } catch (e) {}
  </script>
</head>
<body>
  {% include "_backdrop.html" %}
  {% include "_intro.html" %}

  <div id="app">
    <main class="login-main">
      <section class="login-card{% if error %} has-error{% endif %}">
        <div class="login-lock" aria-hidden="true">
          <svg class="login-lock-svg" viewBox="0 0 120 150">
            <path class="shackle" d="M32 66 V44 a28 28 0 0 1 56 0 V66" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
            <rect x="14" y="64" width="92" height="76" rx="16" fill="rgba(6, 12, 22, 0.92)" stroke="currentColor" stroke-width="3.5"/>
            <circle cx="60" cy="96" r="8" fill="currentColor"/>
            <rect x="56" y="98" width="8" height="18" rx="3" fill="currentColor"/>
          </svg>
        </div>

        <h1 class="login-title">Yönetici girişi</h1>
        <p class="login-sub">Devam etmek için parolanızı girin.</p>

        {% if error %}
        <div class="error" role="alert">
          <i class="fa-solid fa-circle-exclamation"></i>
          <div>{{ error }}</div>
        </div>
        {% endif %}

        <form method="post" action="/login" class="login-form">
          <label for="password">Parola</label>
          <div class="field">
            <i class="fa-solid fa-key" aria-hidden="true"></i>
            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="••••••••••••" required autofocus>
          </div>
          <button type="submit" class="btn btn-block">Giriş yap <i class="fa-solid fa-arrow-right"></i></button>
        </form>

        <p class="login-foot">Parolayı unuttuysanız <code>.env</code> dosyasındaki <code>WEB_PASSWORD</code> satırına bakın.</p>
      </section>
    </main>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
